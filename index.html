<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Global News</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #07090e;
            --surface: #111622;
            --surface-hover: #192030;
            --border: rgba(0, 255, 204, 0.12);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --badge-bg: rgba(0, 255, 204, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }
        
        /* Header & Location */
        .header {
            position: sticky; top: 0; background: rgba(7, 9, 14, 0.92); backdrop-filter: blur(12px);
            padding: 14px 16px; border-bottom: 1px solid var(--border); z-index: 100;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .logo { font-size: 16px; font-weight: 900; letter-spacing: -0.5px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
        .live-badge { font-size: 10px; font-weight: 700; color: #22c55e; background: rgba(34, 197, 94, 0.15); padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }
        .pulse-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } 100% { opacity: 1; transform: scale(1); } }

        .location-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        select {
            width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text-main);
            padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; outline: none; transition: border-color 0.2s;
        }
        select:focus { border-color: var(--accent); }

        /* Categories */
        .categories {
            display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-chip {
            background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
            padding: 7px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: all 0.2s;
        }
        .cat-chip.active { background: var(--accent); color: #07090e; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

        /* Feed */
        .feed { padding: 4px 16px; display: flex; flex-direction: column; gap: 14px; }
        .news-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px;
            cursor: pointer; transition: transform 0.15s, background 0.15s; position: relative; overflow: hidden;
        }
        .news-card:active { transform: scale(0.98); }
        .news-card.new-item { animation: fadeIn 0.5s ease; border-color: var(--accent); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .news-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .news-tag { font-size: 10px; font-weight: 800; color: var(--accent); background: var(--badge-bg); padding: 3px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .news-time { font-size: 11px; color: var(--text-muted); font-weight: 500; }
        .news-title { font-size: 15px; font-weight: 800; line-height: 1.4; margin-bottom: 8px; color: #fff; }
        .news-snippet { font-size: 13px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Modal Full Reader */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(7, 9, 14, 0.85); backdrop-filter: blur(16px);
            z-index: 1000; display: flex; flex-direction: column; justify-content: flex-end;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--surface); border-top: 1px solid var(--border); border-radius: 24px 24px 0 0;
            max-height: 85vh; overflow-y: auto; padding: 24px 20px 40px; transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .modal-overlay.open .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-close { background: rgba(255,255,255,0.08); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .modal-tag { font-size: 11px; font-weight: 800; color: var(--accent); background: var(--badge-bg); padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
        .modal-title { font-size: 20px; font-weight: 900; line-height: 1.35; margin-bottom: 14px; color: #fff; }
        .modal-source-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; font-weight: 600; }
        .modal-body { font-size: 14px; line-height: 1.7; color: #cbd5e1; display: flex; flex-direction: column; gap: 14px; }

        .loading-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <div class="logo">⚡ NEXUS LIVE</div>
            <div class="live-badge">
                <div class="pulse-dot"></div>
                <span id="liveTickerText">Прямой эфир</span>
            </div>
        </div>
        <div class="location-grid">
            <select id="countrySelect" onchange="onCountryChange()">
                <option value="">Выберите страну</option>
            </select>
            <select id="citySelect" disabled onchange="onCityChange()">
                <option value="">Все города</option>
            </select>
        </div>
    </div>

    <div class="categories">
        <div class="cat-chip active" onclick="filterCategory('all', this)">Все новости</div>
        <div class="cat-chip" onclick="filterCategory('urgent', this)">🔥 Срочно</div>
        <div class="cat-chip" onclick="filterCategory('economy', this)">🪙 Экономика</div>
        <div class="cat-chip" onclick="filterCategory('tech', this)">💻 Технологии</div>
        <div class="cat-chip" onclick="filterCategory('society', this)">🌍 Общество</div>
    </div>

    <div class="feed" id="newsFeed">
        <div class="loading-state">Выберите страну вверху для активации ленты новостей...</div>
    </div>

    <!-- Модальное окно полного чтения статьи -->
    <div class="modal-overlay" id="articleModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-tag" id="modalTag">НОВОСТЬ</span>
                <button class="modal-close" onclick="closeModalDirect()">✕</button>
            </div>
            <h2 class="modal-title" id="modalTitle">Заголовок статьи</h2>
            <div class="modal-source-row">
                <span id="modalSource">Источник: Nexus Feed</span>
                <span id="modalTime">Только что</span>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Текст статьи целиком -->
            </div>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch(e) {}

    const countriesData = [
        { country: "Россия", cities: ["Москва", "Санкт-Петербург", "Новосибирск", "Екатеринбург", "Казань", "Нижний Новгород", "Сочи", "Владивосток"] },
        { country: "Казахстан", cities: ["Алматы", "Астана", "Шымкент", "Караганда", "Актобе"] },
        { country: "Беларусь", cities: ["Минск", "Гомель", "Гродно", "Брест"] },
        { country: "Узбекистан", cities: ["Ташкент", "Самарканд", "Бухара"] },
        { country: "ОАЭ", cities: ["Дубай", "Абу-Даби"] },
        { country: "США", cities: ["Нью-Йорк", "Лос-Анджелес", "Майами"] }
    ];

    let selectedCountry = '';
    let selectedCity = '';
    let currentCategory = 'all';
    let activeArticles = [];
    let liveInterval = null;

    function initCountries() {
        const countrySelect = document.getElementById('countrySelect');
        countriesData.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.country;
            opt.textContent = item.country;
            countrySelect.appendChild(opt);
        });
    }

    function onCountryChange() {
        selectedCountry = document.getElementById('countrySelect').value;
        const citySelect = document.getElementById('citySelect');
        citySelect.innerHTML = '<option value="">Все города (общая сводка)</option>';
        citySelect.disabled = true;
        selectedCity = '';

        if (!selectedCountry) {
            document.getElementById('newsFeed').innerHTML = '<div class="loading-state">Выберите страну для загрузки ленты...</div>';
            return;
        }

        const countryObj = countriesData.find(c => c.country === selectedCountry);
        if (countryObj && countryObj.cities.length > 0) {
            countryObj.cities.forEach(city => {
                const opt = document.createElement('option');
                opt.value = city;
                opt.textContent = city;
                citySelect.appendChild(opt);
            });
            citySelect.disabled = false;
        }

        loadNewsData();
        startRealtimeEngine();
    }

    function onCityChange() {
        selectedCity = document.getElementById('citySelect').value;
        loadNewsData();
    }

    function filterCategory(cat, el) {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentCategory = cat;
        renderFeed();
    }

    function loadNewsData() {
        const loc = selectedCity ? `${selectedCity}, ${selectedCountry}` : selectedCountry;
        
        activeArticles = [
            {
                id: 1,
                category: 'urgent',
                tag: 'Срочно',
                title: `Экстренный выпуск: масштабные изменения и ключевые события в регионе ${loc}`,
                snippet: `Прямая трансляция оперативных сводок, экстренных заявлений и аналитики экспертов за последние минуты.`,
                fullText: [
                    `Ситуация в регионе ${loc} привлекает внимание ведущих аналитических центров. По последним данным профильных ведомств, зафиксирован беспрецедентный рост деловой и социальной активности.`,
                    `Эксперты отмечают, что принятые на текущей неделе стратегические решения уже начинают приносить первые результаты. В частности, модернизируются ключевые городские артерии и внедряются передовые цифровые протоколы.`,
                    `Специалисты рекомендуют следить за дальнейшими официальными обновлениями, так как ситуация продолжает динамично развиваться. Наш портал продолжает следить за развитием событий в режиме 24/7.`
                ],
                source: 'Nexus Global Wire',
                time: 'Только что'
            },
            {
                id: 2,
                category: 'economy',
                tag: 'Экономика',
                title: `Финансовый пульс: аналитика рынка, инвестиции и ключевые показатели в ${loc}`,
                snippet: `Обзор макроэкономических тенденций, динамика котировок и экспертный прогноз на ближайший квартал.`,
                fullText: [
                    `Финансовый сектор ${loc} демонстрирует высокую устойчивость на фоне глобальных рыночных колебаний. Инвесторы пересматривают портфели в пользу высокотехнологичных активов и инфраструктурных проектов.`,
                    `По словам независимых экспертов, объем привлеченных инвестиций за последний отчетный период вырос на рекордные показатели. Это открывает новые возможности как для крупного бизнеса, так и для частных инициатив.`,
                    `Особое внимание уделяется цифровизации финансовых расчетов и интеграции новых платежных шлюзов, что значительно ускоряет транзакции внутри региона.`
                ],
                source: 'Market Intelligence',
                time: '14 мин. назад'
            },
            {
                id: 3,
                category: 'tech',
                tag: 'Технологии',
                title: `Цифровая трансформация: запуск инновационных проектов и инфраструктуры`,
                snippet: `Как новейшие технологические решения меняют повседневную жизнь и городскую среду.`,
                fullText: [
                    `В ${loc} дан старт масштабной программе цифровизации ключевых городских систем. Новые высокоскоростные сети передачи данных и распределенные реестры обеспечивают максимальную прозрачность и безопасность всех процессов.`,
                    `Разработчики отмечают огромный интерес со стороны местного бизнес-сообщества к внедрению автоматизированных систем управления на базе искусственного интеллекта.`,
                    `Ожидается, что в течение ближайшего года эффективность городской логистики вырастет в несколько раз благодаря переходу на облачные стандарты нового поколения.`
                ],
                source: 'TechPulse Daily',
                time: '32 мин. назад'
            },
            {
                id: 4,
                category: 'society',
                tag: 'Общество',
                title: `Культурный календарь и социальные инициативы: главные события недели`,
                snippet: `Анонсы масштабных мероприятий, экологические программы и инициативы жителей.`,
                fullText: [
                    `Общественная жизнь ${loc} наполнена яркими событиями. Стартовал новый сезон экологических и образовательных программ, объединивших тысячи активных участников.`,
                    `Местные власти совместно с волонтерскими организациями запустили серию грантовых конкурсов для поддержки молодежных стартапов и культурных инициатив.`,
                    `Все подробности предстоящих мероприятий можно узнать на официальных информационных ресурсах города.`
                ],
                source: 'Region Life',
                time: '1 час назад'
            }
        ];

        renderFeed();
    }

    function renderFeed() {
        const feedContainer = document.getElementById('newsFeed');
        feedContainer.innerHTML = '';

        let filtered = activeArticles;
        if (currentCategory !== 'all') {
            filtered = activeArticles.filter(item => item.category === currentCategory);
        }

        if (filtered.length === 0) {
            feedContainer.innerHTML = '<div class="loading-state">В этой категории пока нет свежих новостей</div>';
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'news-card' + (item.isNew ? ' new-item' : '');
            card.onclick = () => openArticle(item);
            card.innerHTML = `
                <div class="news-meta">
                    <span class="news-tag">${item.tag}</span>
                    <span class="news-time">${item.time}</span>
                </div>
                <div class="news-title">${item.title}</div>
                <div class="news-snippet">${item.snippet}</div>
            `;
            feedContainer.appendChild(card);
        });
    }

    function openArticle(item) {
        document.getElementById('modalTag').innerText = item.tag;
        document.getElementById('modalTitle').innerText = item.title;
        document.getElementById('modalSource').innerText = `Источник: ${item.source}`;
        document.getElementById('modalTime').innerText = item.time;
        
        const bodyContainer = document.getElementById('modalBody');
        bodyContainer.innerHTML = '';
        item.fullText.forEach(paragraph => {
            const p = document.createElement('p');
            p.textContent = paragraph;
            bodyContainer.appendChild(p);
        });

        document.getElementById('articleModal').classList.add('open');
    }

    function closeModal(e) {
        if (e.target.id === 'articleModal') {
            document.getElementById('articleModal').classList.remove('open');
        }
    }

    function closeModalDirect() {
        document.getElementById('articleModal').classList.remove('open');
    }

    // Симуляция живого потока реального времени (каждые 30 сек добавляется свежая новость)
    function startRealtimeEngine() {
        if (liveInterval) clearInterval(liveInterval);
        
        liveInterval = setInterval(() => {
            if (!selectedCountry) return;
            const loc = selectedCity ? `${selectedCity}, ${selectedCountry}` : selectedCountry;
            
            const liveUpdates = [
                `Экстренная сводка: новые данные по развитию транспортной сети в ${loc}`,
                `Срочно: экспертный консилиум подвел итоги инвестиционной недели в ${loc}`,
                `Молния: объявлен запуск нового цифрового проекта в ${loc}`
            ];
            const randomTitle = liveUpdates[Math.floor(Math.random() * liveUpdates.length)];

            const newItem = {
                id: Date.now(),
                category: 'urgent',
                tag: '⚡ Live Молния',
                title: randomTitle,
                snippet: `Только что поступили оперативные данные из официальных источников по ситуации в локации ${loc}.`,
                fullText: [
                    `В ${loc} зафиксировано срочное событие, привлекшее внимание широкой общественности.`,
                    `Оперативные службы и экспертные группы уже работают на месте, оценивая масштабы и перспективы развития ситуации.`,
                    `Следите за нашими экстренными выпусками — мы обновляем информацию каждую минуту.`
                ],
                source: 'Nexus Live Stream',
                time: 'Только что',
                isNew: true
            };

            activeArticles.unshift(newItem);
            renderFeed();

            // Анимация текста тикера
            const ticker = document.getElementById('liveTickerText');
            ticker.textContent = 'Новая сводка получена!';
            setTimeout(() => { ticker.textContent = 'Прямой эфир'; }, 4000);
        }, 30000);
    }

    initCountries();
</script>
</body>
</html>
