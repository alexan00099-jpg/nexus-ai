<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выбор страны и города</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1f2c;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .title { font-size: 16px; font-weight: 800; margin-bottom: 16px; color: var(--accent); text-align: center; }
        .field-group { margin-bottom: 14px; }
        .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; display: block; }
        select { width: 100%; background: #0f1117; border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 14px; outline: none; }
        select:focus { border-color: var(--accent); }
        .result { margin-top: 16px; padding: 12px; background: rgba(59, 130, 246, 0.1); border-radius: 10px; font-size: 13px; text-align: center; color: var(--accent); font-weight: 700; }
    </style>
</head>
<body>

<div class="card">
    <div class="title">🌍 Выберите геолокацию</div>
    
    <div class="field-group">
        <label class="label">Страна</label>
        <select id="countrySelect" onchange="onCountryChange()">
            <option value="">Загрузка стран...</option>
        </select>
    </div>

    <div class="field-group">
        <label class="label">Город</label>
        <select id="citySelect" disabled onchange="onCityChange()">
            <option value="">Сначала выберите страну</option>
        </select>
    </div>

    <div class="result" id="resultText">Выбор не сделан</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch(e) {}

    let countriesData = [];

    async function loadCountries() {
        try {
            const response = await fetch('https://countriesnow.space/api/v0.5/countries');
            const data = await response.json();
            if (!data.error) {
                countriesData = data.data;
                const countrySelect = document.getElementById('countrySelect');
                countrySelect.innerHTML = '<option value="">Выберите страну...</option>';
                
                countriesData.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.country;
                    option.textContent = item.country;
                    countrySelect.appendChild(option);
                });
            }
        } catch (e) {
            document.getElementById('countrySelect').innerHTML = '<option value="">Ошибка загрузки</option>';
        }
    }

    function onCountryChange() {
        const selectedCountryName = document.getElementById('countrySelect').value;
        const citySelect = document.getElementById('citySelect');
        citySelect.innerHTML = '<option value="">Выберите город...</option>';
        citySelect.disabled = true;

        if (!selectedCountryName) {
            document.getElementById('resultText').innerText = 'Выбор не сделан';
            return;
        }

        const countryObj = countriesData.find(c => c.country === selectedCountryName);
        if (countryObj && countryObj.cities.length > 0) {
            countryObj.cities.sort().forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            });
            citySelect.disabled = false;
        } else {
            citySelect.innerHTML = '<option value="">Нет данных о городах</option>';
        }

        document.getElementById('resultText').innerText = `Страна: ${selectedCountryName}`;
    }

    function onCityChange() {
        const country = document.getElementById('countrySelect').value;
        const city = document.getElementById('citySelect').value;
        if (city) {
            document.getElementById('resultText').innerText = `Выбрано: ${country}, ${city}`;
        }
    }

    loadCountries();
</script>
</body>
</html>
