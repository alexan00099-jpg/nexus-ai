<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex 5-Level Referral App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #090a0f;
            --surface: #131823;
            --border: rgba(0, 255, 204, 0.15);
            --accent: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 16px; }
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        .title { font-size: 16px; font-weight: 900; margin-bottom: 8px; color: var(--accent); }
        .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .balance { font-size: 32px; font-weight: 900; text-align: center; margin: 20px 0; color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="balance" id="balanceVal">0 🪙</div>

    <div class="card">
        <div class="title">Профиль</div>
        <div class="stat-row"><span>Имя:</span> <span id="profileName">Загрузка...</span></div>
        <div class="stat-row"><span>Ваш Telegram ID:</span> <span id="profileId">-</span></div>
    </div>

    <div class="card">
        <div class="title">Реферальная сеть (5 Уровней)</div>
        <div class="stat-row"><span>Уровень 1 (5%):</span> <span id="lvl1">0</span></div>
        <div class="stat-row"><span>Уровень 2 (3%):</span> <span id="lvl2">0</span></div>
        <div class="stat-row"><span>Уровень 3 (2%):</span> <span id="lvl3">0</span></div>
        <div class="stat-row"><span>Уровень 4 (1%):</span> <span id="lvl4">0</span></div>
        <div class="stat-row"><span>Уровень 5 (0.5%):</span> <span id="lvl5">0</span></div>
        <button class="btn" onclick="copyRefLink()">Пригласить друга</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const BOT_USERNAME = 'YourAppBot';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch(e) {}

    let currentUser = null;

    async function initApp() {
        const tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : {
            id: Math.floor(Math.random() * 1000000),
            first_name: 'TestUser'
        };

        document.getElementById('profileName').innerText = tgUser.first_name;
        document.getElementById('profileId').innerText = tgUser.id;

        const startParam = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
        let uplineId = null;
        if (startParam && startParam.startsWith('ref_')) {
            uplineId = parseInt(startParam.replace('ref_', ''), 10);
        }

        const { data, error } = await supabase.rpc('register_or_get_user', {
            p_telegram_id: tgUser.id,
            p_username: tgUser.first_name,
            p_upline_id: uplineId
        });

        if (error) {
            console.error('Ошибка авторизации:', error);
            return;
        }

        currentUser = data;
        document.getElementById('balanceVal').innerText = Math.floor(currentUser.balance) + ' 🪙';

        loadReferralStats(tgUser.id);
    }

    async function loadReferralStats(telegramId) {
        const { data, error } = await supabase.rpc('get_referral_stats', {
            p_telegram_id: telegramId
        });

        if (!error && data) {
            document.getElementById('lvl1').innerText = data.lvl1;
            document.getElementById('lvl2').innerText = data.lvl2;
            document.getElementById('lvl3').innerText = data.lvl3;
            document.getElementById('lvl4').innerText = data.lvl4;
            document.getElementById('lvl5').innerText = data.lvl5;
        }
    }

    function copyRefLink() {
        if (!currentUser) return;
        const refLink = `https://t.me/${BOT_USERNAME}/app?start=ref_${currentUser.telegram_id}`;
        navigator.clipboard.writeText(refLink).then(() => {
            alert('Реферальная ссылка скопирована в буфер обмена!');
        });
    }

    initApp();
</script>
</body>
</html>
