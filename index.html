<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Live News</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1f2c;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --badge-bg: rgba(59, 130, 246, 0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; }
        
        .header {
            position: sticky; top: 0; background: rgba(15, 17, 23, 0.95); backdrop-filter: blur(10px);
            padding: 12px 16px; border-bottom: 1px solid var(--border); z-index: 100;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .logo { font-size: 15px; font-weight: 800; letter-spacing: -0.5px; color: var(--accent); }
        .update-status { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
        .pulse-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .location-box {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }
        select {
            width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text-main);
            padding: 8px 10px; border-radius: 8px; font-size: 12px; outline: none;
        }
        select:focus { border-color: var(--accent); }

        .feed { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .news-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
            cursor: pointer; text-decoration: none; color: inherit; display: block; transition: transform 0.1s;
        }
        .news-card:active { transform: scale(0.98); }
        .news-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .news-tag { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--badge-bg); padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        .news-time { font-size: 11px; color: var(--text-muted); }
        .news-title { font-size: 14px; font-weight: 700; line-height: 1.4; margin-bottom: 6px; }
        .news-snippet { font-size: 12px; color: var(--text-muted); line-height: 1.3; }
        .loading { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <div class="logo">⚡ REAL-TIME NEWS</div>
            <div class="update-status">
                <div class="pulse-dot"></div>
                <span id="timerText">В эфире</span>
            </div>
        </div>
        <div class="location-box">
            <select id="countrySelect" onchange="onCountryChange()">
                <option value="">Загрузка стран...</option>
            </select>
            <select id="citySelect" disabled onchange="onCityChange()">
                <option value="">Сначала страну</option>
            </select>
        </div>
    </div>

    <div class="feed" id="newsFeed">
        <div class="loading">Выберите страну вверху для загрузки ленты...</div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch(e) {}

    // Вставьте ваш API ключ от GNews.io (если есть), либо оставьте как есть для демонстрационного режима
    const GNEWS_API_KEY = 'YOUR_GNEWS_API_KEY'; 

    let countriesData = [];
    let selectedCountry = '';
    let selectedCity = '';

    async function loadCountries() {
        try {
            const response = await fetch('https://countriesnow.space/api/v0.5/countries');
            const data = await response.json();
            if (!data.error) {
                countriesData = data.data;
                const countrySelect = document.getElementById('countrySelect');
                countrySelect.innerHTML = '<option value="">Выберите страну</option>';
                
                countriesData.sort((a, b) => a.country.localeCompare(b.country)).forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.country;
                    option.textContent = item.country;
                    countrySelect.appendChild(option);
                });
            }
        } catch (e) {
            document.getElementById('countrySelect').innerHTML = '<option value="">Ошибка загрузки стран</option>';
        }
    }

    function onCountryChange() {
        selectedCountry = document.getElementById('countrySelect').value;
        const citySelect = document.getElementById('citySelect');
        citySelect.innerHTML = '<option value="">Выберите город</option>';
        citySelect.disabled = true;
        selectedCity = '';

        if (!selectedCountry) {
            document.getElementById('newsFeed').innerHTML = '<div class="loading">Выберите страну и город для просмотра новостей</div>';
            return;
        }

        const countryObj = countriesData.find(c => c.country === selectedCountry);
        if (countryObj && countryObj.cities.length > 0) {
            countryObj.cities.sort().forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            });
            citySelect.disabled = false;
        }

        fetchNews(selectedCountry, '');
    }

    function onCityChange() {
        selectedCity = document.getElementById('citySelect').value;
        if (selectedCity) {
            fetchNews(selectedCountry, selectedCity);
        }
    }

    async function fetchNews(country, city) {
        const feedContainer = document.getElementById('newsFeed');
        feedContainer.innerHTML = '<div class="loading">Обновление ленты в реальном времени...</div>';

        let searchQuery = city ? `${city} ${country}` : country;

        if (GNEWS_API_KEY === 'YOUR_GNEWS_API_KEY') {
            setTimeout(() => {
                renderMockNews(country, city);
            }, 400);
            return;
        }

        try {
            const url = `https://gnews.io/api/v4/search?q=${encodeURIComponent(searchQuery)}&lang=ru&max=10&apikey=${GNEWS_API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.articles && data.articles.length > 0) {
                feedContainer.innerHTML = '';
                data.articles.forEach(article => {
                    const card = document.createElement('a');
                    card.className = 'news-card';
                    card.href = article.url;
                    card.target = '_blank';
                    
                    const timeAgo = Math.floor((new Date() - new Date(article.publishedAt)) / (1000 * 60));
                    
                    card.innerHTML = `
                        <div class="news-meta">
                            <span class="news-tag">${article.source.name}</span>
                            <span class="news-time">${timeAgo > 0 ? timeAgo + ' мин. назад' : 'Только что'}</span>
                        </div>
                        <div class="news-title">${article.title}</div>
                        <div class="news-snippet">${article.description || ''}</div>
                    `;
                    feedContainer.appendChild(card);
                });
            } else {
                feedContainer.innerHTML = `<div class="loading">По запросу "${searchQuery}" свежих новостей не найдено</div>`;
            }
        } catch (e) {
            feedContainer.innerHTML = '<div class="loading">Ошибка подключения к новостному серверу</div>';
        }
    }

    function renderMockNews(country, city) {
        const feedContainer = document.getElementById('newsFeed');
        feedContainer.innerHTML = '';
        
        let loc = city ? `${city}, ${country}` : country;
        const mockItems = [
            { title: `Главные события и сводка новостей: ${loc}`, desc: `Свежий срез актуальной информации, происшествия и аналитика за последние часы.`, source: 'Live Feed', time: 'Только что' },
            { title: `Развитие инфраструктуры и городские инициативы`, desc: `Что меняется в регионе, ключевые заявления и планы на текущую неделю.`, source: 'Local Pulse', time: '12 мин. назад' },
            { title: `Экономические итоги и тенденции рынка`, desc: `Обзор ключевых показателей и изменений в финансовом секторе выбранной локации.`, source: 'Region Monitor', time: '35 мин. назад' }
        ];

        mockItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
                <div class="news-meta">
                    <span class="news-tag">${item.source}</span>
                    <span class="news-time">${item.time}</span>
                </div>
                <div class="news-title">${item.title}</div>
                <div class="news-snippet">${item.desc}</div>
            `;
            feedContainer.appendChild(card);
        });
    }

    loadCountries();
</script>
</body>
</html>
