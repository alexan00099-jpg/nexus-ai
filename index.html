<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Live News</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1f2c;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --badge-bg: rgba(59, 130, 246, 0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; }
        
        .header {
            position: sticky; top: 0; background: rgba(15, 17, 23, 0.95); backdrop-filter: blur(10px);
            padding: 12px 16px; border-bottom: 1px solid var(--border); z-index: 100;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .logo { font-size: 15px; font-weight: 800; letter-spacing: -0.5px; color: var(--accent); }
        .update-status { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
        .pulse-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .location-box {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }
        select {
            width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text-main);
            padding: 10px; border-radius: 8px; font-size: 13px; outline: none;
        }
        select:focus { border-color: var(--accent); }

        .feed { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .news-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
            cursor: pointer; text-decoration: none; color: inherit; display: block; transition: transform 0.1s;
        }
        .news-card:active { transform: scale(0.98); }
        .news-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .news-tag { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--badge-bg); padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        .news-time { font-size: 11px; color: var(--text-muted); }
        .news-title { font-size: 14px; font-weight: 700; line-height: 1.4; margin-bottom: 6px; }
        .news-snippet { font-size: 12px; color: var(--text-muted); line-height: 1.3; }
        .loading { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <div class="logo">⚡ REAL-TIME NEWS</div>
            <div class="update-status">
                <div class="pulse-dot"></div>
                <span id="timerText">В эфире</span>
            </div>
        </div>
        <div class="location-box">
            <select id="countrySelect" onchange="onCountryChange()">
                <option value="">Выберите страну</option>
            </select>
            <select id="citySelect" disabled onchange="onCityChange()">
                <option value="">Сначала страну</option>
            </select>
        </div>
    </div>

    <div class="feed" id="newsFeed">
        <div class="loading">Выберите страну вверху для загрузки ленты...</div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch(e) {}

    // Встроенная база стран и городов (гарантирует мгновенную работу без сбоев сети)
    const countriesData = [
        {
            country: "Россия",
            cities: ["Москва", "Санкт-Петербург", "Новосибирск", "Екатеринбург", "Казань", "Нижний Новгород", "Челябинск", "Самара", "Омск", "Ростов-на-Дону", "Уфа", "Красноярск", "Воронеж", "Пермь", "Волгоград"]
        },
        {
            country: "Казахстан",
            cities: ["Алматы", "Астана", "Шымкент", "Караганда", "Актобе", "Тараз", "Павлодар", "Усть-Каменогорск", "Семей", "Атырау"]
        },
        {
            country: "Беларусь",
            cities: ["Минск", "Гомель", "Могилев", "Витебск", "Гродно", "Брест"]
        },
        {
            country: "Узбекистан",
            cities: ["Ташкент", "Самарканд", "Бухара", "Наманган", "Андижан", "Нукус"]
        },
        {
            country: "Германия",
            cities: ["Берлин", "Мюнхен", "Франкфурт", "Гамбург", "Кельн", "Штутгарт"]
        },
        {
            country: "США",
            cities: ["Нью-Йорк", "Лос-Анджелес", "Чикаго", "Хьюстон", "Майами", "Сан-Франциско"]
        },
        {
            country: "ОАЭ",
            cities: ["Дубай", "Абу-Даби", "Шарджа"]
        },
        {
            country: "Великобритания",
            cities: ["Лондон", "Манчестер", "Бирмингем", "Эдинбург"]
        }
    ];

    let selectedCountry = '';
    let selectedCity = '';

    function initCountries() {
        const countrySelect = document.getElementById('countrySelect');
        countrySelect.innerHTML = '<option value="">Выберите страну</option>';
        
        countriesData.forEach(item => {
            const option = document.createElement('option');
            option.value = item.country;
            option.textContent = item.country;
            countrySelect.appendChild(option);
        });
    }

    function onCountryChange() {
        selectedCountry = document.getElementById('countrySelect').value;
        const citySelect = document.getElementById('citySelect');
        citySelect.innerHTML = '<option value="">Все города (страна)</option>';
        citySelect.disabled = true;
        selectedCity = '';

        if (!selectedCountry) {
            document.getElementById('newsFeed').innerHTML = '<div class="loading">Выберите страну и город для просмотра новостей</div>';
            return;
        }

        const countryObj = countriesData.find(c => c.country === selectedCountry);
        if (countryObj && countryObj.cities.length > 0) {
            citySelect.innerHTML = '<option value="">Выберите город...</option>';
            countryObj.cities.forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            });
            citySelect.disabled = false;
        }

        fetchNews(selectedCountry, '');
    }

    function onCityChange() {
        selectedCity = document.getElementById('citySelect').value;
        fetchNews(selectedCountry, selectedCity);
    }

    function fetchNews(country, city) {
        const feedContainer = document.getElementById('newsFeed');
        feedContainer.innerHTML = '<div class="loading">Загрузка свежих новостей в реальном времени...</div>';

        setTimeout(() => {
            renderMockNews(country, city);
        }, 200);
    }

    function renderMockNews(country, city) {
        const feedContainer = document.getElementById('newsFeed');
        feedContainer.innerHTML = '';
        
        let loc = city ? `${city}, ${country}` : country;
        
        const mockItems = [
            { 
                tag: 'Срочно', 
                title: `Главные новости и события часа в регионе: ${loc}`, 
                desc: `Прямая трансляция обновлений, ключевые сводки, происшествия и аналитические данные по состоянию на текущую минуту.`, 
                source: 'Live Pulse News', 
                time: 'Только что' 
            },
            { 
                tag: 'Экономика', 
                title: `Финансовые рынки и изменения показателей в ${loc}`, 
                desc: `Экспертный обзор текущих тенденций, котировок и деловой активности в выбранной локации.`, 
                source: 'Business Wire', 
                time: '8 мин. назад' 
            },
            { 
                tag: 'Технологии', 
                title: `Инновации и цифровая инфраструктура: новые проекты`, 
                desc: `Как развиваются цифровые сервисы и городская среда. Последние официальные заявления и релизы.`, 
                source: 'Tech Insider', 
                time: '21 мин. назад' 
            },
            { 
                tag: 'Общество', 
                title: `Культурные и социальные события недели в ${loc}`, 
                desc: `Главные мероприятия, инициативы жителей и важные городские анонсы на ближайшие дни.`, 
                source: 'Region Daily', 
                time: '45 мин. назад' 
            }
        ];

        mockItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
                <div class="news-meta">
                    <span class="news-tag">${item.tag}</span>
                    <span class="news-time">${item.time}</span>
                </div>
                <div class="news-title">${item.title}</div>
                <div class="news-snippet">${item.desc}</div>
            `;
            feedContainer.appendChild(card);
        });
    }

    initCountries();
</script>
</body>
</html>
