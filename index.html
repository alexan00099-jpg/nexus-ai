<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live News Feed</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1f2c;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --badge-bg: rgba(59, 130, 246, 0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; }
        
        .header {
            position: sticky; top: 0; background: rgba(15, 17, 23, 0.9); backdrop-filter: blur(10px);
            padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        .logo { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; }
        .update-status { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
        .pulse-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .categories {
            display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-chip {
            background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer;
        }
        .cat-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .feed { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
        .news-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px;
            cursor: pointer; transition: transform 0.1s;
        }
        .news-card:active { transform: scale(0.98); }
        .news-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .news-tag { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--badge-bg); padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        .news-time { font-size: 11px; color: var(--text-muted); }
        .news-title { font-size: 14px; font-weight: 700; line-height: 1.4; margin-bottom: 6px; }
        .news-snippet { font-size: 12px; color: var(--text-muted); line-height: 1.3; }

        .dock-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 17, 23, 0.95);
            backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000;
        }
        .dock-btn { background: none; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700; cursor: pointer; text-align: center; flex: 1; }
        .dock-btn.active { color: var(--accent); }
        .dock-btn span { display: block; font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ LIVE NEWS</div>
        <div class="update-status">
            <div class="pulse-dot"></div>
            <span id="timerText">Обновлено только что</span>
        </div>
    </div>

    <div class="categories">
        <div class="cat-chip active" onclick="filterNews('all', this)">Все</div>
        <div class="cat-chip" onclick="filterNews('top', this)">🔥 Топ дня</div>
        <div class="cat-chip" onclick="filterNews('crypto', this)">🪙 Крипта</div>
        <div class="cat-chip" onclick="filterNews('tech', this)">💻 Технологии</div>
        <div class="cat-chip" onclick="filterNews('world', this)">🌍 Мир</div>
    </div>

    <div class="feed" id="newsFeed">
        <!-- Сюда динамически подгружаются новости -->
    </div>

    <div class="dock-bar">
        <button class="dock-btn active" onclick="switchTab('feed', this)"><span>📰</span>Лента</button>
        <button class="dock-btn" onclick="switchTab('top', this)"><span>🔥</span>Главное</button>
        <button class="dock-btn" onclick="switchTab('saved', this)"><span>🔖</span>Закладки</button>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch(e) {}

    // Демо-данные новостей (в реальном приложении подтягиваются из Supabase / API)
    const mockNews = [
        { id: 1, category: 'crypto', tag: 'Криптовалюта', time: 2, title: 'TON блокчейн бьет рекорды активности внутри Telegram Mini Apps', snippet: 'Суточный объем транзакций вырос на 45% благодаря запуску новых вирусных проектов.' },
        { id: 2, category: 'top', tag: 'Главное', time: 12, title: 'Глобальные технологические тренды: что ждет рынок мобильных приложений', snippet: 'Эксперты выделяют переход на легковесные веб-интерфейсы внутри мессенджеров.' },
        { id: 3, category: 'tech', tag: 'Технологии', time: 25, title: 'Вышел новый стандарт баз данных для работы с real-time потоками', snippet: 'Разработчики получили инструменты для мгновенной синхронизации данных без задержек.' },
        { id: 4, category: 'world', tag: 'Мир', time: 41, title: 'Крупнейшие мессенджеры внедряют новые стандарты безопасности данных', snippet: 'Защита пользовательских сессий выходит на принципиально новый уровень.' }
    ];

    function renderNews(filter = 'all') {
        const feedContainer = document.getElementById('newsFeed');
        feedContainer.innerHTML = '';

        let filtered = mockNews;
        if (filter !== 'all') {
            filtered = mockNews.filter(item => item.category === filter || (filter === 'top' && item.category === 'top'));
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
                <div class="news-meta">
                    <span class="news-tag">${item.tag}</span>
                    <span class="news-time">${item.time} мин назад</span>
                </div>
                <div class="news-title">${item.title}</div>
                <div class="news-snippet">${item.snippet}</div>
            `;
            feedContainer.appendChild(card);
        });
    }

    function filterNews(category, el) {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        renderNews(category);
    }

    function switchTab(tab, btn) {
        document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(tab === 'top') renderNews('top');
        else renderNews('all');
    }

    // Симуляция автообновления каждые 5 минут
    let secondsAgo = 0;
    setInterval(() => {
        secondsAgo += 60;
        if(secondsAgo >= 300) {
            secondsAgo = 0;
            document.getElementById('timerText').innerText = 'Только что обновлено';
            // Здесь в будущем вызывается функция перезапроса данных с сервера
        } else {
            document.getElementById('timerText').innerText = `Обновлено ${Math.floor(secondsAgo/60)} мин. назад`;
        }
    }, 60000);

    renderNews();
</script>
</body>
</html>
